# Applied only with the Assessment capability and PostgreSQL enabled.
# This is the qualification configuration, not evidence of measured capacity.
services:
  postgres:
    command:
      - postgres
      - -c
      - max_connections=32
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_compression=on
