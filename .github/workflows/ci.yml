name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Check public repository content and new history
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          HISTORY_BASE=""
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ "${PR_ACTION}" == "synchronize" ]] &&
               [[ "${EVENT_BEFORE_SHA}" =~ ^[0-9a-f]{40}$ ]] &&
               git cat-file -e "${EVENT_BEFORE_SHA}^{commit}" 2>/dev/null; then
              HISTORY_BASE="${EVENT_BEFORE_SHA}"
            else
              HISTORY_BASE="${PR_BASE_SHA}"
            fi
          elif [[ "${EVENT_NAME}" == "push" ]] &&
               [[ "${EVENT_BEFORE_SHA}" =~ ^[0-9a-f]{40}$ ]] &&
               [[ "${EVENT_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            HISTORY_BASE="${EVENT_BEFORE_SHA}"
          fi

          if [[ -n "${HISTORY_BASE}" ]]; then
            git cat-file -e "${HISTORY_BASE}^{commit}"
            python scripts/check_public_repository.py --history-base "${HISTORY_BASE}"
          else
            python scripts/check_public_repository.py
          fi
      - run: pip install -e .[dev]
      - name: Validate dependency inventory
        run: |
          python scripts/validate_dependency_inventory.py
          ruff check scripts/generate_dependency_inventory.py scripts/validate_dependency_inventory.py tests/backend/test_dependency_inventory.py
      - name: Validate admitted runtime toolchain
        run: |
          python scripts/validate_runtime_toolchain_admission.py
          ruff check scripts/validate_runtime_toolchain_admission.py scripts/verify_runtime_toolchain_sources.py tests/backend/test_runtime_toolchain_admission.py
      - run: python scripts/validate_capability_registry.py
      - run: python scripts/validate_architecture_precedence.py
      - run: ruff check server tests migrations
      - run: mypy server/wsi_viewer
      - run: pytest --cov=wsi_viewer --cov-report=term-missing

  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: pathlab_test
          POSTGRES_USER: pathlab_test
          POSTGRES_PASSWORD: pathlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pathlab_test -d pathlab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PATHLAB_POSTGRES_TEST_URL: postgresql+psycopg://pathlab_test:pathlab_test@127.0.0.1:5432/pathlab_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install -e .[dev]
      - run: >-
          pytest
          tests/backend/test_postgres_foundation.py
          tests/backend/test_postgres_migration.py
          tests/backend/test_postgres_classroom.py
      - name: Verify PostgreSQL backup and disposable restore
        env:
          PATHLAB_DATABASE_URL: postgresql+psycopg://pathlab_test:pathlab_test@127.0.0.1:5432/pathlab_test
          PATHLAB_RELEASE_SHA: ${{ github.sha }}
          PATHLAB_BACKUP_SIGNING_KEY: synthetic-ci-postgres-backup-key-32-bytes
          POSTGRES_DB: pathlab_test
          POSTGRES_USER: pathlab_test
        run: |
          set -euo pipefail
          alembic upgrade head
          mapfile -t POSTGRES_CONTAINERS < <(docker ps --filter publish=5432 --format '{{.ID}}')
          [[ "${#POSTGRES_CONTAINERS[@]}" -eq 1 ]]
          POSTGRES_CONTAINER="${POSTGRES_CONTAINERS[0]}"
          [[ "$(docker inspect --format '{{.Config.Image}}' "${POSTGRES_CONTAINER}")" == \
            "postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2" ]]
          DATA_DIR="${RUNNER_TEMP}/pathlab-data"
          install -d -m 700 "${DATA_DIR}"/{originals,private,public,backups}
          printf 'synthetic,non-PHI\n' > "${DATA_DIR}/private/restore-proof.txt"
          export PATHLAB_POSTGRES_CONTAINER="${POSTGRES_CONTAINER}"
          export PATHLAB_DATA_DIR="${DATA_DIR}"
          export PATHLAB_BACKUP_DIR="${DATA_DIR}/backups"
          BACKUP_PATH="$(bash deploy/scripts/backup-postgres.sh)"
          bash deploy/scripts/verify-postgres-restore-drill.sh "${BACKUP_PATH}"
      - name: Verify staging PostgreSQL cutover evidence workflow
        env:
          PATHLAB_RELEASE_SHA: ${{ github.sha }}
          PATHLAB_SECRET_KEY: synthetic-ci-migration-signing-key-32-bytes
          PATHLAB_BACKUP_SIGNING_KEY: synthetic-ci-postgres-backup-key-32-bytes
        run: |
          set -euo pipefail
          mapfile -t POSTGRES_CONTAINERS < <(docker ps --filter publish=5432 --format '{{.ID}}')
          [[ "${#POSTGRES_CONTAINERS[@]}" -eq 1 ]]
          POSTGRES_CONTAINER="${POSTGRES_CONTAINERS[0]}"
          TARGET_DATABASE="pathlab_cutover_ci"
          docker exec -i "${POSTGRES_CONTAINER}" \
            dropdb --if-exists --force --username pathlab_test "${TARGET_DATABASE}"
          docker exec -i "${POSTGRES_CONTAINER}" \
            createdb --username pathlab_test "${TARGET_DATABASE}"
          trap 'docker exec -i "${POSTGRES_CONTAINER}" dropdb --if-exists --force --username pathlab_test "${TARGET_DATABASE}" >/dev/null 2>&1 || true' EXIT

          SOURCE_DATABASE="${RUNNER_TEMP}/cutover-source.sqlite3"
          env -u PATHLAB_DATABASE_PASSWORD_FILE \
            PATHLAB_DATABASE_URL="sqlite:///${SOURCE_DATABASE}" \
            alembic upgrade head
          python - "${SOURCE_DATABASE}" <<'PY'
          import sqlite3
          import sys
          with sqlite3.connect(sys.argv[1]) as database:
              database.execute("PRAGMA wal_checkpoint(TRUNCATE)")
              database.execute("PRAGMA journal_mode=DELETE")
          PY

          DATA_DIR="${RUNNER_TEMP}/pathlab-cutover-data"
          EVIDENCE_DIR="${RUNNER_TEMP}/pathlab-cutover-evidence"
          STATUS_FILE="${EVIDENCE_DIR}/status.json"
          PASSWORD_FILE="${RUNNER_TEMP}/pathlab-cutover-password"
          install -d -m 700 "${DATA_DIR}"/{originals,private,public,backups}
          printf 'synthetic,non-PHI\n' > "${DATA_DIR}/private/restore-proof.txt"
          printf 'pathlab_test\n' > "${PASSWORD_FILE}"
          chmod 600 "${PASSWORD_FILE}"

          export PATHLAB_CUTOVER_ENVIRONMENT=staging
          export PATHLAB_CUTOVER_EVIDENCE_DIR="${EVIDENCE_DIR}"
          export PATHLAB_POSTGRES_TARGET_URL="postgresql+psycopg://pathlab_test@127.0.0.1:5432/${TARGET_DATABASE}"
          export PATHLAB_POSTGRES_PASSWORD_FILE="${PASSWORD_FILE}"
          export PATHLAB_POSTGRES_CONTAINER="${POSTGRES_CONTAINER}"
          export PATHLAB_DATA_DIR="${DATA_DIR}"
          export PATHLAB_BACKUP_DIR="${DATA_DIR}/backups"
          export POSTGRES_DB="${TARGET_DATABASE}"
          export POSTGRES_USER=pathlab_test
          bash deploy/scripts/verify-postgres-cutover.sh \
            "${SOURCE_DATABASE}" "${STATUS_FILE}"
          python - "${STATUS_FILE}" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as source:
              status = json.load(source)
          assert status["state"] == "SUCCEEDED"
          assert status["failureCode"] is None
          assert status["progressCounters"] == {
              "sourceChecks": 1,
              "migrations": 1,
              "backups": 1,
              "restoreDrills": 1,
          }
          PY

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24.14.0", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web build
      - name: Check annotation bundle budgets against the real base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${PR_BASE_SHA}" ]]; then
            BASE_SHA="${PR_BASE_SHA}"
          elif [[ "${PUSH_BEFORE_SHA}" =~ ^[0-9a-f]{40}$ ]] &&
               [[ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="${PUSH_BEFORE_SHA}"
          else
            git fetch --no-tags origin main
            BASE_SHA="$(git merge-base HEAD origin/main)"
            if [[ "${BASE_SHA}" == "$(git rev-parse HEAD)" ]]; then
              BASE_SHA="$(git rev-parse HEAD^)"
            fi
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          BASE_WORKTREE="${RUNNER_TEMP}/pathlab-bundle-base-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "${BASE_WORKTREE}"
          git worktree add --detach "${BASE_WORKTREE}" "${BASE_SHA}"
          trap 'git worktree remove --force "${BASE_WORKTREE}"' EXIT
          pnpm --dir "${BASE_WORKTREE}" install --frozen-lockfile
          pnpm --dir "${BASE_WORKTREE}/apps/web" exec \
            vite build --config vite.config.ts --manifest
          PATHLAB_BUNDLE_BASELINE="${BASE_WORKTREE}/apps/web/dist"
          test -f "${PATHLAB_BUNDLE_BASELINE}/index.html"
          pnpm --dir apps/web check:annotation-bundle -- --baseline "$PATHLAB_BUNDLE_BASELINE"

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24.14.0", cache: pnpm }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium firefox webkit
      - name: Run private annotation and public isolation browser matrix
        env:
          PLAYWRIGHT_PORT: "5217"
        run: >-
          pnpm --dir apps/web exec playwright test
          e2e/annotation-responsive.spec.ts
          e2e/shared-viewer-responsive.spec.ts
          --workers=2

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOMAIN: viewer.example.test
      ACME_EMAIL: ci@example.test
      PATHLAB_SECRET_KEY: ci-only-secret-not-used-in-production
      PATHLAB_DATA_DIR: /tmp/pathlab-data
      PATHLAB_POSTGRES_DB: pathlab_ci
      PATHLAB_POSTGRES_USER: pathlab_ci
      PATHLAB_POSTGRES_PASSWORD_FILE: /tmp/pathlab-postgres-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate deployment shell syntax
        run: bash -n deploy/scripts/*.sh
      - name: Validate Compose configuration
        run: |
          docker compose -f deploy/compose.yaml config
          docker compose -f deploy/compose.yaml -f deploy/compose.postgres.yaml config
      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -e DOMAIN -e ACME_EMAIL
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build ARM64 backend image
        run: >-
          docker buildx build --platform linux/arm64
          --cache-from type=gha,scope=backend
          --cache-to type=gha,mode=max,scope=backend
          -f deploy/Dockerfile.backend .
      - name: Build ARM64 web image
        run: >-
          docker buildx build --platform linux/arm64
          --cache-from type=gha,scope=web
          --cache-to type=gha,mode=max,scope=web
          -f deploy/Dockerfile.web .
