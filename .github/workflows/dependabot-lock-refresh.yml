name: Dependabot lock refresh

on:
  pull_request:
    paths:
      - "apps/web/package.json"
      - "packages/viewer-ui/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/dependabot-lock-refresh.yml"

permissions:
  contents: read

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'dependabot/npm_and_yarn/web-dependencies-dbd5506ffe'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - run: pnpm peers check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refreshed-pnpm-lock-91-vite6
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
