name: pathlab-viewer

services:
  caddy:
    image: pathlab-viewer-caddy:${PATHLAB_RELEASE_IMAGE_TAG:-live}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/.env}
      PATHLAB_CLASSROOM_SERVICE_URL: http://classroom:8001
      PATHLAB_ASSESSMENT_SERVICE_URL: http://assessment:8002
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ${PATHLAB_DATA_DIR:-/srv/pathlab/data}/delivery/individual:/pathlab-individual:ro
      - ${PATHLAB_DATA_DIR:-/srv/pathlab/data}/public:/pathlab-public:ro
      - ${PATHLAB_DATA_DIR:-/srv/pathlab/data}/private:/pathlab-private:ro
      - ${PATHLAB_DATA_DIR:-/srv/pathlab/data}/delivery/assessment:/pathlab-assessment:ro
    depends_on:
      api:
        condition: service_healthy
      classroom:
        condition: service_healthy
      assessment:
        condition: service_healthy
      tile-service:
        condition: service_healthy
      tusd:
        condition: service_started
    networks:
      - default
      - pathlab-internal
    mem_limit: 256m
    cpus: 1.25
    cpu_shares: 1024

  api:
    image: pathlab-viewer-api:${PATHLAB_RELEASE_IMAGE_TAG:-live}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["sh", "-c", "mkdir -p /data/database /data/tus && alembic upgrade head && pathlab-admin reconcile-storage && exec uvicorn wsi_viewer.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips=*"]
    environment: &pathlab-environment
      PATHLAB_ENVIRONMENT: production
      PATHLAB_SERVICE_ROLE: general
      PATHLAB_DATABASE_URL: sqlite:////data/database/pathlab.sqlite3
      PATHLAB_DATA_ROOT: /data
      PATHLAB_SECRET_KEY: ${PATHLAB_SECRET_KEY:?Set PATHLAB_SECRET_KEY in deploy/.env}
      PATHLAB_SECURE_COOKIES: "true"
      PATHLAB_TUS_PUBLIC_URL: /api/v1/uploads/
      PATHLAB_TUS_INTERNAL_UPLOAD_DIR: /data/tus
      PATHLAB_MULTI_SHARE_ENABLED: "${PATHLAB_MULTI_SHARE_ENABLED:-true}"
      PATHLAB_ANNOTATIONS_ENABLED: "${PATHLAB_ANNOTATIONS_ENABLED:-false}"
      PATHLAB_ADMIN_ANNOTATION_CANARY_ENABLED: "${PATHLAB_ADMIN_ANNOTATION_CANARY_ENABLED:-false}"
      PATHLAB_CLASSROOM_ENABLED: "${PATHLAB_PRODUCTION_CLASSROOM_ENABLED:-false}"
      PATHLAB_ASSESSMENT_ENABLED: "${PATHLAB_ASSESSMENT_ENABLED:-false}"
      PATHLAB_STUDY_MODE_ENABLED: "${PATHLAB_STUDY_MODE_ENABLED:-false}"
      PATHLAB_STUDY_COACH_AI_ENABLED: "${PATHLAB_STUDY_COACH_AI_ENABLED:-false}"
      PATHLAB_STUDY_COACH_AI_PILOT_ENABLED: "${PATHLAB_STUDY_COACH_AI_PILOT_ENABLED:-false}"
      PATHLAB_STUDY_MAX_LEARNERS: "${PATHLAB_STUDY_MAX_LEARNERS:-500}"
      PATHLAB_CLASSROOM_PROTECTION_ENABLED: "${PATHLAB_CLASSROOM_PROTECTION_ENABLED:-false}"
      PATHLAB_IDENTITY_GOVERNANCE_ENABLED: "${PATHLAB_IDENTITY_GOVERNANCE_ENABLED:-false}"
      PATHLAB_CLASSROOM_SINGLETON: "true"
      PATHLAB_CLASSROOM_MAX_PARTICIPANTS: "${PATHLAB_CLASSROOM_MAX_PARTICIPANTS:-300}"
      PATHLAB_INTERNAL_FILE_REDIRECTS: "true"
      PATHLAB_TILE_SERVICE_URL: http://tile-service:8090
    volumes:
      - ${PATHLAB_DATA_DIR:-/srv/pathlab/data}:/data
    networks:
      - default
      - pathlab-internal
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.50
    cpu_shares: 1024

  classroom:
    image: pathlab-viewer-classroom:${PATHLAB_RELEASE_IMAGE_TAG:-live}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["uvicorn", "wsi_viewer.main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips=*"]
    expose: ["8001"]
    environment:
      <<: *pathlab-environment
      PATHLAB_SERVICE_ROLE: classroom
    volumes:
      - ${PATHLAB_DATA_DIR:-/srv/pathlab/data}:/data
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - pathlab-internal
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8001/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1.00
    cpu_shares: 1024

  assessment:
    image: pathlab-viewer-assessment:${PATHLAB_RELEASE_IMAGE_TAG:-live}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["uvicorn", "wsi_viewer.main:app", "--host", "0.0.0.0", "--port", "8002", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips=*"]
    expose: ["8002"]
    environment:
      <<: *pathlab-environment
      PATHLAB_SERVICE_ROLE: assessment
      PATHLAB_ASSESSMENT_ENABLED: "${PATHLAB_ASSESSMENT_ENABLED:-false}"
    volumes:
      - ${PATHLAB_DATA_DIR:-/srv/pathlab/data}:/data
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - pathlab-internal
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8002/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1.00
    cpu_shares: 1024

  tile-service:
    image: pathlab-viewer-tile-service:${PATHLAB_RELEASE_IMAGE_TAG:-live}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["pathlab-tiles"]
    expose: ["8090"]
    environment:
      <<: *pathlab-environment
      PATHLAB_SERVICE_ROLE: tile
      PATHLAB_TILE_CACHE_ROOT: /cache/ome-tiles
      PATHLAB_TILE_CACHE_MAX_BYTES: "${PATHLAB_TILE_CACHE_MAX_BYTES:-2147483648}"
      PATHLAB_TILE_CACHE_LOW_WATER_BYTES: "${PATHLAB_TILE_CACHE_LOW_WATER_BYTES:-1879048192}"
      PATHLAB_TILE_CACHE_MAX_TEMP_BYTES: "${PATHLAB_TILE_CACHE_MAX_TEMP_BYTES:-8388608}"
      PATHLAB_TILE_CACHE_MEMORY_BYTES: "${PATHLAB_TILE_CACHE_MEMORY_BYTES:-268435456}"
      PATHLAB_TILE_RENDER_CONCURRENCY: "${PATHLAB_TILE_RENDER_CONCURRENCY:-2}"
      PATHLAB_LIBVIPS_CONCURRENCY: "${PATHLAB_LIBVIPS_CONCURRENCY:-1}"
      PATHLAB_LIBVIPS_CACHE_MAX_MEM_BYTES: "${PATHLAB_LIBVIPS_CACHE_MAX_MEM_BYTES:-268435456}"
      PATHLAB_LIBVIPS_CACHE_MAX_FILES: "${PATHLAB_LIBVIPS_CACHE_MAX_FILES:-128}"
      PATHLAB_LIBVIPS_CACHE_MAX_OPERATIONS: "${PATHLAB_LIBVIPS_CACHE_MAX_OPERATIONS:-100}"
      VIPS_CONCURRENCY: "1"
      MALLOC_ARENA_MAX: "2"
    volumes:
      - ${PATHLAB_DATA_DIR:-/srv/pathlab/data}/originals:/data/originals:ro
      - pathlab-tile-cache:/cache/ome-tiles
    networks:
      - pathlab-internal
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8090/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 1g
    cpus: 1.50
    cpu_shares: 768

  tusd:
    image: tusproject/tusd:v2.9.2@sha256:9c61565fccd2689b052aa78e52d9558f309e98f6320960746f225d2fd73a35e3
    user: "10001:10001"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - -host=0.0.0.0
      - -port=8080
      - -base-path=/api/v1/uploads/
      - -behind-proxy
      - -upload-dir=/data/tus
      - -max-size=5368709120
      - -disable-download
      - -hooks-http=http://api:8000/api/v1/internal/tus/hooks
      - -hooks-enabled-events=pre-create,post-finish
      - -hooks-http-forward-headers=Authorization
    volumes:
      - ${PATHLAB_DATA_DIR:-/srv/pathlab/data}/tus:/data/tus
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.35

  worker:
    image: pathlab-viewer-worker:${PATHLAB_RELEASE_IMAGE_TAG:-live}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["pathlab-worker"]
    stop_grace_period: 30m
    environment:
      <<: *pathlab-environment
      PATHLAB_SERVICE_ROLE: worker
      PATHLAB_LIBVIPS_CONCURRENCY: "${PATHLAB_LIBVIPS_CONCURRENCY:-1}"
      PATHLAB_LIBVIPS_CACHE_MAX_MEM_BYTES: "${PATHLAB_LIBVIPS_CACHE_MAX_MEM_BYTES:-268435456}"
      PATHLAB_LIBVIPS_CACHE_MAX_FILES: "${PATHLAB_LIBVIPS_CACHE_MAX_FILES:-128}"
      PATHLAB_LIBVIPS_CACHE_MAX_OPERATIONS: "${PATHLAB_LIBVIPS_CACHE_MAX_OPERATIONS:-100}"
      VIPS_CONCURRENCY: "1"
      MALLOC_ARENA_MAX: "2"
    volumes:
      - ${PATHLAB_DATA_DIR:-/srv/pathlab/data}:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pathlab-worker-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 6g
    cpus: 1.50
    cpu_shares: 256

volumes:
  caddy_data:
  caddy_config:
  pathlab-tile-cache:

networks:
  pathlab-internal:
    internal: true
