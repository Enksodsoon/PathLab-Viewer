name: Capacity certification

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CERTIFY_PRODUCTION_MAX_STRESS to run the full guarded 2,000-seat certification
        required: true
        type: string
      window_start_ict:
        description: Protected 3-hour window start as YYYY-MM-DDTHH:MM:00+07:00; dispatch 20-40 minutes beforehand
        required: true
        type: string
      recovery_run_id:
        description: Optional terminal failed capacity run whose encrypted synthetic fixture must be reconciled first
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  checks: read

concurrency:
  group: production-control
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.ref == 'refs/heads/main'
      && github.event.repository.visibility == 'public'
      && inputs.confirmation == 'CERTIFY_PRODUCTION_MAX_STRESS'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
    outputs:
      browser-ci-run-id: ${{ steps.release.outputs.browser-ci-run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked OCI dependencies
        run: pip install --require-hashes -r deploy/oci-cli-requirements.txt
      - name: Require exact main release and current successful checks
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "${GITHUB_SHA}"
          browser_id=""
          for check in backend browser web containers repository-and-dependencies \
            "CodeQL (python)" "CodeQL (javascript-typescript)"; do
            record="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?filter=latest&per_page=100" \
              --jq ".check_runs[] | select(.name == \"${check}\") | [.id, .conclusion] | @tsv" |
              head -n 1)"
            read -r check_id conclusion <<< "${record}"
            test "${conclusion}" = success
            if [[ "${check}" == browser ]]; then browser_id="${check_id}"; fi
          done
          test -n "${browser_id}"
          echo "browser-ci-run-id=${browser_id}" >> "${GITHUB_OUTPUT}"
      - name: Build immutable synchronized plan
        env:
          WINDOW_START_ICT: ${{ inputs.window_start_ict }}
        run: |
          set -euo pipefail
          window_start_raw="${WINDOW_START_ICT}"
          [[ "${window_start_raw}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:00\+07:00$ ]]
          window_start_epoch="$(date -d "${window_start_raw}" +%s)"
          now_epoch="$(date +%s)"
          lead_seconds="$((window_start_epoch - now_epoch))"
          (( lead_seconds >= 1200 && lead_seconds <= 2400 )) || {
            echo "Custom protected window must start 20-40 minutes after dispatch." >&2
            exit 1
          }
          window_start_epoch_ms="$((window_start_epoch * 1000))"
          start_epoch_ms="$(((window_start_epoch + 9 * 60) * 1000))"
          python tests/load/distributed_certification.py plan \
            --run-id "${GITHUB_RUN_ID}" \
            --workflow-sha "${GITHUB_SHA}" \
            --browser-ci-run-id "${{ steps.release.outputs.browser-ci-run-id }}" \
            --window-start-epoch-ms "${window_start_epoch_ms}" \
            --start-epoch-ms "${start_epoch_ms}" \
            --output "${RUNNER_TEMP}/capacity-plan.json"
          jq -n --arg runId "${GITHUB_RUN_ID}" --arg workflowSha "${GITHUB_SHA}" \
            --argjson ciRunId "${{ steps.release.outputs.browser-ci-run-id }}" \
            '{runId:$runId,workflowSha:$workflowSha,ciRunId:$ciRunId,approved:true,
              projects:["chromium","firefox","webkit","mobile-chromium"]}' \
            > "${RUNNER_TEMP}/browser-matrix.json"
      - name: Validate protected fixture principals
        env:
          CAPACITY_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          LOAD_TEST_ADMIN_USERNAME: ${{ secrets.LOAD_TEST_ADMIN_USERNAME }}
          LOAD_TEST_ADMIN_PASSWORD: ${{ secrets.LOAD_TEST_ADMIN_PASSWORD }}
          LOAD_TEST_ADMIN_SLIDE_ID: ${{ secrets.LOAD_TEST_ADMIN_SLIDE_ID }}
          LOAD_TEST_PUBLIC_ID: ${{ secrets.LOAD_TEST_PUBLIC_ID }}
          DEPLOY_EVIDENCE_KEY: ${{ secrets.PATHLAB_DEPLOY_EVIDENCE_KEY }}
        run: |
          set -Eeuo pipefail
          for value in "${CAPACITY_BASE_URL}" "${LOAD_TEST_ADMIN_USERNAME}" \
            "${LOAD_TEST_ADMIN_PASSWORD}" "${LOAD_TEST_ADMIN_SLIDE_ID}" \
            "${LOAD_TEST_PUBLIC_ID}" "${DEPLOY_EVIDENCE_KEY}"; do
            test -n "${value}" || {
              echo "Protected capacity configuration is incomplete." >&2
              exit 1
            }
            echo "::add-mask::${value}"
          done
          cookie_jar="${RUNNER_TEMP}/capacity-preflight-cookies"
          login="$(curl --fail --silent --show-error --max-time 10 \
            --cookie-jar "${cookie_jar}" --header 'Content-Type: application/json' \
            --data "$(jq -cn --arg username "${LOAD_TEST_ADMIN_USERNAME}" \
              --arg password "${LOAD_TEST_ADMIN_PASSWORD}" \
              '{username:$username,password:$password}')" \
            "${CAPACITY_BASE_URL%/}/api/v1/auth/session")"
          jq -e '.csrfToken | type == "string" and length >= 32' <<< "${login}" >/dev/null
          curl --fail --silent --show-error --max-time 15 --cookie "${cookie_jar}" \
            "${CAPACITY_BASE_URL%/}/api/v1/admin/slides/${LOAD_TEST_ADMIN_SLIDE_ID}" >/dev/null
          curl --fail --silent --show-error --max-time 15 \
            "${CAPACITY_BASE_URL%/}/api/v1/public/slides/${LOAD_TEST_PUBLIC_ID}" >/dev/null
          rm -f -- "${cookie_jar}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capacity-plan
          path: ${{ runner.temp }}/capacity-plan.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capacity-browser-matrix
          path: ${{ runner.temp }}/browser-matrix.json
          if-no-files-found: error
          retention-days: 1
      - name: Configure pinned OCI access
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_BASTION_KNOWN_HOSTS: ${{ secrets.OCI_BASTION_KNOWN_HOSTS }}
          OCI_TARGET_DEPLOY_KEY: ${{ secrets.OCI_TARGET_DEPLOY_KEY }}
          OCI_TARGET_KNOWN_HOSTS: ${{ secrets.OCI_TARGET_KNOWN_HOSTS }}
        run: bash deploy/scripts/configure-capacity-oci.sh
      - name: Reconcile an exact terminal failed-run fixture
        if: inputs.recovery_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          CAPACITY_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          LOAD_TEST_ADMIN_USERNAME: ${{ secrets.LOAD_TEST_ADMIN_USERNAME }}
          LOAD_TEST_ADMIN_PASSWORD: ${{ secrets.LOAD_TEST_ADMIN_PASSWORD }}
          OCI_BASTION_ID: ${{ vars.OCI_BASTION_ID }}
          OCI_INSTANCE_ID: ${{ vars.OCI_INSTANCE_ID }}
          OCI_TARGET_PRIVATE_IP: ${{ vars.OCI_TARGET_PRIVATE_IP }}
          OCI_KNOWN_HOSTS_FILE: /home/runner/.ssh/known_hosts
        run: |
          set -Eeuo pipefail
          [[ "${RECOVERY_RUN_ID}" =~ ^[1-9][0-9]{5,19}$ ]]
          [[ "${RECOVERY_RUN_ID}" != "${GITHUB_RUN_ID}" ]]
          failed_run="$(gh run view "${RECOVERY_RUN_ID}" \
            --json status,conclusion,headSha,headBranch,event,workflowName)"
          jq -e '.status == "completed" and
            (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") and
            .headBranch == "main" and .event == "workflow_dispatch" and
            .workflowName == "Capacity certification" and
            (.headSha | test("^[0-9a-f]{40}$"))' <<< "${failed_run}" >/dev/null
          failed_sha="$(jq -er .headSha <<< "${failed_run}")"
          python deploy/scripts/capacity_fixtures.py reconcile \
            --run-id "${RECOVERY_RUN_ID}" \
            --base-url "${CAPACITY_BASE_URL}" --username "${LOAD_TEST_ADMIN_USERNAME}" \
            --password "${LOAD_TEST_ADMIN_PASSWORD}"
          bash deploy/scripts/capacity-control-via-bastion.sh \
            "capacity-recover run=${RECOVERY_RUN_ID} sha=${failed_sha}" \
            > "${RUNNER_TEMP}/capacity-recovery.json"
          sessions="${RUNNER_TEMP}/recovery-bastion-sessions.json"
          oci bastion session list --bastion-id "${OCI_BASTION_ID}" --all > "${sessions}"
          while IFS= read -r session_id; do
            deleted=false
            for _ in 1 2 3; do
              if oci bastion session delete --session-id "${session_id}" --force \
                  >/dev/null 2>&1; then
                deleted=true
                break
              fi
              sleep 2
            done
            if [[ "${deleted}" != true ]]; then
              state="$(oci bastion session get --session-id "${session_id}" \
                --query 'data."lifecycle-state"' --raw-output 2>&1 || true)"
              [[ "${state}" == DELETED || "${state}" == *NotFound* || "${state}" == *404* ]]
            fi
          done < <(jq -r --arg prefix "pathlab-capacity-${RECOVERY_RUN_ID}-" \
            '.data[] | select((."display-name" // "") | startswith($prefix)) |
             select(."lifecycle-state" != "DELETED") | .id' "${sessions}")
          oci bastion session list --bastion-id "${OCI_BASTION_ID}" --all > "${sessions}"
          remaining="$(jq --arg prefix "pathlab-capacity-${RECOVERY_RUN_ID}-" \
            '[.data[] | select((."display-name" // "") | startswith($prefix)) |
              select(."lifecycle-state" == "ACTIVE" or ."lifecycle-state" == "CREATING" or
                ."lifecycle-state" == "DELETING")] | length' "${sessions}")"
          [[ "${remaining}" == 0 ]]
          jq -e --arg sha "${GITHUB_SHA}" \
            '.releaseSha == $sha and .releaseExact == true and .servicesExact == true and
             .ready == true and .classroomEnabled == true and .finalCapacity == 300 and
             .annotationsEnabled == false and .controllerReconciled == true' \
            "${RUNNER_TEMP}/capacity-recovery.json" >/dev/null
      - name: Reject admission while any real or synthetic Classroom is present
        env:
          CAPACITY_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          LOAD_TEST_ADMIN_USERNAME: ${{ secrets.LOAD_TEST_ADMIN_USERNAME }}
          LOAD_TEST_ADMIN_PASSWORD: ${{ secrets.LOAD_TEST_ADMIN_PASSWORD }}
        run: |
          python deploy/scripts/capacity_fixtures.py assert-empty \
            --base-url "${CAPACITY_BASE_URL}" --username "${LOAD_TEST_ADMIN_USERNAME}" \
            --password "${LOAD_TEST_ADMIN_PASSWORD}"
      - name: Validate the exact same-release runtime safety checkpoint
        env:
          OCI_BASTION_ID: ${{ vars.OCI_BASTION_ID }}
          OCI_INSTANCE_ID: ${{ vars.OCI_INSTANCE_ID }}
          OCI_TARGET_PRIVATE_IP: ${{ vars.OCI_TARGET_PRIVATE_IP }}
          OCI_KNOWN_HOSTS_FILE: /home/runner/.ssh/known_hosts
        run: |
          set -euo pipefail
          bash deploy/scripts/capacity-control-via-bastion.sh \
            "capacity-runtime-preflight expected=${GITHUB_SHA}" \
            > "${RUNNER_TEMP}/capacity-runtime-preflight.json"
          jq -e --arg sha "${GITHUB_SHA}" \
            '.releaseSha == $sha and .releaseExact == true and .servicesExact == true and
             .ready == true and .watchdogExpected == true and .watchdogActive == true and
             .classroomEnabled == true and .finalCapacity == 300 and
             .annotationsEnabled == false and
             (.runtimeManifestDigest | test("^[0-9a-f]{64}$"))' \
            "${RUNNER_TEMP}/capacity-runtime-preflight.json" >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capacity-runtime-preflight
          path: ${{ runner.temp }}/capacity-runtime-preflight.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate zero-incremental-cost accounting configuration and build evidence
        env:
          PROJECTED_EGRESS_BYTES: ${{ vars.OCI_PROJECTED_MONTHLY_EGRESS_BYTES }}
          PROJECTED_MONTHLY_RUNS: ${{ vars.CAPACITY_PROJECTED_MONTHLY_RUNS }}
          OCI_INSTANCE_ID: ${{ vars.OCI_INSTANCE_ID }}
          APPROVED_RESOURCE_COUNT: ${{ vars.OCI_APPROVED_RESOURCE_COUNT }}
          APPROVED_RESOURCE_DIGEST: ${{ secrets.OCI_APPROVED_RESOURCE_DIGEST }}
        run: |
          set -euo pipefail
          [[ "${PROJECTED_EGRESS_BYTES}" =~ ^[1-9][0-9]*$ ]]
          [[ "${PROJECTED_MONTHLY_RUNS}" =~ ^[1-9][0-9]*$ ]]
          [[ "${OCI_INSTANCE_ID}" == ocid1.instance.* ]]
          [[ "${APPROVED_RESOURCE_COUNT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${APPROVED_RESOURCE_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          tenancy_id="$(awk -F= '/^tenancy=/{print $2; exit}' ~/.oci/config)"
          usage_start="$(date -u +%Y-%m-01T00:00:00Z)"
          usage_end="$(date -u +%Y-%m-%dT00:00:00Z)"
          oci usage-api usage-summary request-summarized-usages \
            --tenant-id "${tenancy_id}" --granularity MONTHLY --query-type COST \
            --time-usage-started "${usage_start}" --time-usage-ended "${usage_end}" \
            > "${RUNNER_TEMP}/oci-cost-private.json"
          month_cost="$(jq -r '[.data.items[]? | (."computed-amount" // 0 | tonumber)] | add // 0' \
            "${RUNNER_TEMP}/oci-cost-private.json")"
          oci compute instance get --instance-id "${OCI_INSTANCE_ID}" \
            > "${RUNNER_TEMP}/oci-instance-private.json"
          compartment_id="$(jq -er '.data."compartment-id"' "${RUNNER_TEMP}/oci-instance-private.json")"
          availability_domain="$(jq -er '.data."availability-domain"' "${RUNNER_TEMP}/oci-instance-private.json")"
          ocpus="$(jq -er '.data."shape-config".ocpus' "${RUNNER_TEMP}/oci-instance-private.json")"
          memory_gb="$(jq -er '.data."shape-config"."memory-in-gbs"' "${RUNNER_TEMP}/oci-instance-private.json")"
          oci compute boot-volume-attachment list --all --compartment-id "${compartment_id}" \
            --availability-domain "${availability_domain}" --instance-id "${OCI_INSTANCE_ID}" \
            > "${RUNNER_TEMP}/oci-boot-attachments-private.json"
          boot_gb=0
          while IFS= read -r volume_id; do
            size="$(oci bv boot-volume get --boot-volume-id "${volume_id}" | jq -er '.data."size-in-gbs"')"
            boot_gb="$((boot_gb + size))"
          done < <(jq -er '.data[] | ."boot-volume-id"' "${RUNNER_TEMP}/oci-boot-attachments-private.json")
          oci compute volume-attachment list --all --compartment-id "${compartment_id}" \
            --instance-id "${OCI_INSTANCE_ID}" > "${RUNNER_TEMP}/oci-volume-attachments-private.json"
          block_gb=0
          while IFS= read -r volume_id; do
            size="$(oci bv volume get --volume-id "${volume_id}" | jq -er '.data."size-in-gbs"')"
            block_gb="$((block_gb + size))"
          done < <(jq -r '.data[]? | ."volume-id" // empty' "${RUNNER_TEMP}/oci-volume-attachments-private.json")
          storage_gb="$((boot_gb + block_gb))"
          oci search resource structured-search --limit 1000 \
            --query-text "query all resources where compartmentId = '${compartment_id}'" \
            > "${RUNNER_TEMP}/oci-inventory-private.json"
          stable_inventory="$(jq -c '[.data.items[] |
            select(."lifecycle-state" != "TERMINATED" and ."lifecycle-state" != "DELETED" and
              ."resource-type" != "ConsoleHistory")]' \
            "${RUNNER_TEMP}/oci-inventory-private.json")"
          observed_resources="$(jq -er 'length' <<< "${stable_inventory}")"
          observed_digest="$(jq -cS '[.[] | {id:.identifier,type:."resource-type"}] | sort_by(.type,.id)' \
            <<< "${stable_inventory}" | sha256sum | awk '{print $1}')"
          [[ "${APPROVED_RESOURCE_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          test "${APPROVED_RESOURCE_COUNT}" -ge 1
          permanent_added=true
          [[ "${observed_resources}" -eq "${APPROVED_RESOURCE_COUNT}" && \
             "${observed_digest}" == "${APPROVED_RESOURCE_DIGEST}" ]] && permanent_added=false
          jq -n --argjson cost "${month_cost}" --argjson egress "${PROJECTED_EGRESS_BYTES}" \
            --argjson runs "${PROJECTED_MONTHLY_RUNS}" --argjson ocpus "${ocpus}" \
            --argjson memory "${memory_gb}" --argjson storage "${storage_gb}" \
            --argjson observed "${observed_resources}" --argjson approved "${APPROVED_RESOURCE_COUNT}" \
            --arg observedDigest "${observed_digest}" --arg approvedDigest "${APPROVED_RESOURCE_DIGEST}" \
            --argjson permanent "${permanent_added}" \
            '{currency:"SGD",monthToDateCost:$cost,projectedMonthlyEgressBytes:$egress,
              projectedMonthlyRuns:$runs,permanentResourcesAdded:$permanent,
              observedResourceCount:$observed,approvedResourceCount:$approved,
              observedInventoryDigest:$observedDigest,approvedInventoryDigest:$approvedDigest,
              computeOcpus:$ocpus,memoryGb:$memory,storageGb:$storage}' \
            > "${RUNNER_TEMP}/capacity-accounting.json"
          rm -f -- "${RUNNER_TEMP}"/oci-*-private.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capacity-accounting
          path: ${{ runner.temp }}/capacity-accounting.json
          if-no-files-found: error
          retention-days: 1
      - name: Enforce zero-incremental-cost accounting baseline
        run: |
          set -euo pipefail
          jq '{monthToDateCost,permanentResourcesAdded,observedResourceCount,
            approvedResourceCount,observedInventoryDigest,computeOcpus,memoryGb,storageGb}' \
            "${RUNNER_TEMP}/capacity-accounting.json"
          jq -e '(.monthToDateCost | type) == "number" and .monthToDateCost >= 0 and
            .permanentResourcesAdded == false' \
            "${RUNNER_TEMP}/capacity-accounting.json" >/dev/null
      - if: always()
        run: rm -rf -- ~/.oci ~/.ssh

  fixtures:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install --require-hashes -r deploy/oci-cli-requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: capacity-plan, path: "${{ runner.temp }}/capacity-plan"}
      - name: Create and encrypt exact run-owned fixtures
        env:
          CAPACITY_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          LOAD_TEST_ADMIN_USERNAME: ${{ secrets.LOAD_TEST_ADMIN_USERNAME }}
          LOAD_TEST_ADMIN_PASSWORD: ${{ secrets.LOAD_TEST_ADMIN_PASSWORD }}
          LOAD_TEST_ADMIN_SLIDE_ID: ${{ secrets.LOAD_TEST_ADMIN_SLIDE_ID }}
          LOAD_TEST_PUBLIC_ID: ${{ secrets.LOAD_TEST_PUBLIC_ID }}
          DEPLOY_EVIDENCE_KEY: ${{ secrets.PATHLAB_DEPLOY_EVIDENCE_KEY }}
        run: |
          set -Eeuo pipefail
          bundle="${RUNNER_TEMP}/capacity-fixtures.fernet"
          reconcile() {
            [[ -s "${bundle}" ]] || return 0
            python deploy/scripts/capacity_fixtures.py cleanup \
              --input "${bundle}" --evidence-key "${DEPLOY_EVIDENCE_KEY}" \
              --run-id "${GITHUB_RUN_ID}" --workflow-sha "${GITHUB_SHA}" \
              --base-url "${CAPACITY_BASE_URL}" --username "${LOAD_TEST_ADMIN_USERNAME}" \
              --password "${LOAD_TEST_ADMIN_PASSWORD}" || true
          }
          trap reconcile ERR INT TERM
          python deploy/scripts/capacity_fixtures.py create \
            --plan "${RUNNER_TEMP}/capacity-plan/capacity-plan.json" \
            --run-id "${GITHUB_RUN_ID}" --workflow-sha "${GITHUB_SHA}" \
            --base-url "${CAPACITY_BASE_URL}" --username "${LOAD_TEST_ADMIN_USERNAME}" \
            --password "${LOAD_TEST_ADMIN_PASSWORD}" \
            --slide-id "${LOAD_TEST_ADMIN_SLIDE_ID}" --public-id "${LOAD_TEST_PUBLIC_ID}" \
            --evidence-key "${DEPLOY_EVIDENCE_KEY}" --output "${bundle}"
          jq -n --arg runId "${GITHUB_RUN_ID}" --arg workflowSha "${GITHUB_SHA}" \
            --arg planDigest "$(jq -er .planDigest "${RUNNER_TEMP}/capacity-plan/capacity-plan.json")" \
            --arg preparedAt "$(date --iso-8601=seconds)" \
            '{schemaVersion:1,runId:$runId,workflowSha:$workflowSha,planDigest:$planDigest,preparedAt:$preparedAt,
              prepared:true,encrypted:true,syntheticOnly:true,identifiersIncluded:false,
              endpointsValidated:4}' > "${RUNNER_TEMP}/capacity-fixture-status.json"
          trap - ERR INT TERM
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capacity-fixtures-private
          path: ${{ runner.temp }}/capacity-fixtures.fernet
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capacity-fixture-status
          path: ${{ runner.temp }}/capacity-fixture-status.json
          if-no-files-found: error
          retention-days: 1
      - name: Reconcile fixture if publication failed
        if: failure()
        env:
          CAPACITY_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          LOAD_TEST_ADMIN_USERNAME: ${{ secrets.LOAD_TEST_ADMIN_USERNAME }}
          LOAD_TEST_ADMIN_PASSWORD: ${{ secrets.LOAD_TEST_ADMIN_PASSWORD }}
          DEPLOY_EVIDENCE_KEY: ${{ secrets.PATHLAB_DEPLOY_EVIDENCE_KEY }}
        run: |
          [[ -s "${RUNNER_TEMP}/capacity-fixtures.fernet" ]] || exit 0
          python deploy/scripts/capacity_fixtures.py cleanup \
            --input "${RUNNER_TEMP}/capacity-fixtures.fernet" \
            --evidence-key "${DEPLOY_EVIDENCE_KEY}" --run-id "${GITHUB_RUN_ID}" \
            --workflow-sha "${GITHUB_SHA}" --base-url "${CAPACITY_BASE_URL}" \
            --username "${LOAD_TEST_ADMIN_USERNAME}" --password "${LOAD_TEST_ADMIN_PASSWORD}"
      - if: always()
        run: rm -f -- "${RUNNER_TEMP}/capacity-fixtures.fernet" "${RUNNER_TEMP}/capacity-fixture-status.json"

  arm:
    needs: [preflight, fixtures]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install --require-hashes -r deploy/oci-cli-requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: "capacity-*", path: "${{ runner.temp }}/evidence", merge-multiple: true}
      - name: Configure pinned OCI access
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_BASTION_KNOWN_HOSTS: ${{ secrets.OCI_BASTION_KNOWN_HOSTS }}
          OCI_TARGET_DEPLOY_KEY: ${{ secrets.OCI_TARGET_DEPLOY_KEY }}
          OCI_TARGET_KNOWN_HOSTS: ${{ secrets.OCI_TARGET_KNOWN_HOSTS }}
        run: bash deploy/scripts/configure-capacity-oci.sh
      - name: Arm at the explicitly authorized custom ICT window
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_EVIDENCE_KEY: ${{ secrets.PATHLAB_DEPLOY_EVIDENCE_KEY }}
          PROJECTED_EGRESS_BYTES: ${{ vars.OCI_PROJECTED_MONTHLY_EGRESS_BYTES }}
          OCI_BASTION_ID: ${{ vars.OCI_BASTION_ID }}
          OCI_INSTANCE_ID: ${{ vars.OCI_INSTANCE_ID }}
          OCI_TARGET_PRIVATE_IP: ${{ vars.OCI_TARGET_PRIVATE_IP }}
          OCI_KNOWN_HOSTS_FILE: /home/runner/.ssh/known_hosts
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?filter=latest&per_page=100" \
            > "${RUNNER_TEMP}/check-runs.json"
          evidence_key="${RUNNER_TEMP}/deploy-evidence.key"
          evidence_file="${RUNNER_TEMP}/deploy-evidence.json"
          signature_file="${RUNNER_TEMP}/deploy-evidence.signature"
          install -m 600 /dev/null "${evidence_key}"
          printf '%s' "${DEPLOY_EVIDENCE_KEY}" > "${evidence_key}"
          window="$(python deploy/scripts/capacity_window.py \
            --plan "${RUNNER_TEMP}/evidence/capacity-plan.json" describe)"
          arm_epoch="$(jq -er .mutationStartEpoch <<< "${window}")"
          now_epoch="$(date +%s)"
          (( now_epoch <= $(jq -er .armNotAfterEpoch <<< "${window}") )) || {
            echo "Deterministic arm deadline missed." >&2
            exit 1
          }
          (( arm_epoch > now_epoch )) && sleep "$((arm_epoch - now_epoch))"
          month_cost="$(jq -r .monthToDateCost "${RUNNER_TEMP}/evidence/capacity-accounting.json")"
          nonce="$(python -c 'import hashlib,hmac,os; print(hmac.new(os.environ["DEPLOY_EVIDENCE_KEY"].encode(), (os.environ["GITHUB_RUN_ID"]+":"+os.environ["GITHUB_RUN_ATTEMPT"]).encode(), hashlib.sha256).hexdigest())')"
          echo "::add-mask::${nonce}"
          python deploy/scripts/build_deploy_evidence.py \
            --checks "${RUNNER_TEMP}/check-runs.json" --candidate-sha "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" --workflow-run-id "${GITHUB_RUN_ID}" \
            --nonce "${nonce}" --projected-monthly-egress-bytes "${PROJECTED_EGRESS_BYTES}" \
            --month-to-date-cost-sgd "${month_cost}" --key-file "${evidence_key}" \
            --output "${evidence_file}" --signature-output "${signature_file}"
          plan_digest="$(jq -r .planDigest "${RUNNER_TEMP}/evidence/capacity-plan.json")"
          deadline="$(jq -er .cleanupExecutionDeadlineEpoch <<< "${window}")"
          restore_not_after="$(jq -er .restorationDeadlineEpoch <<< "${window}")"
          fault_start="$(jq -r '.stages[] | select(.name == "recovery-1200") | .holdStartEpochMs / 1000 | floor' "${RUNNER_TEMP}/evidence/capacity-plan.json")"
          fault_end="$(jq -r '.stages[] | select(.name == "recovery-1200") | .holdEndEpochMs / 1000 | floor' "${RUNNER_TEMP}/evidence/capacity-plan.json")"
          evidence_b64="$(base64 -w 0 "${evidence_file}" | tr '+/' '-_' | tr -d '=')"
          manifest_digest="$(jq -er .runtimeManifestDigest \
            "${RUNNER_TEMP}/evidence/capacity-runtime-preflight.json")"
          arm_not_after="$(jq -er .armNotAfterEpoch <<< "${window}")"
          window_start="$(jq -er .mutationStartEpoch <<< "${window}")"
          window_end="$(jq -er .windowEndEpoch <<< "${window}")"
          request="capacity-arm ${GITHUB_SHA} run=${GITHUB_RUN_ID} digest=${plan_digest} manifest=${manifest_digest} arm-not-after=${arm_not_after} window-start=${window_start} window-end=${window_end} deadline=${deadline} restore-not-after=${restore_not_after} fault-start=${fault_start} fault-end=${fault_end} evidence=${evidence_b64} signature=$(cat "${signature_file}") nonce=${nonce}"
          arm_remaining="$(python deploy/scripts/capacity_window.py \
            --plan "${RUNNER_TEMP}/evidence/capacity-plan.json" remaining --phase arm)"
          combined_status="$(timeout --signal=TERM --kill-after=10s "${arm_remaining}s" \
            bash deploy/scripts/capacity-control-via-bastion.sh \
              "capacity-runtime-preflight expected=${GITHUB_SHA} manifest=${manifest_digest}" "${request}")"
          runtime_status="$(head -n 1 <<< "${combined_status}")"
          jq -e --arg sha "${GITHUB_SHA}" --arg manifest "${manifest_digest}" \
            '.releaseSha == $sha and .runtimeManifestDigest == $manifest and
             .releaseExact == true and .servicesExact == true and .ready == true and
             .classroomEnabled == true and .finalCapacity == 300 and .annotationsEnabled == false' \
            <<< "${runtime_status}" >/dev/null
      - if: always()
        run: rm -rf -- ~/.oci ~/.ssh; rm -f -- "${RUNNER_TEMP}/deploy-evidence.key"

  failure-watchdog:
    name: Capacity shard failure watchdog
    needs: [arm]
    runs-on: ubuntu-24.04
    timeout-minutes: 178
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - name: Cancel this attempt when a capacity shard cannot succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/watch_capacity_shards.py \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --expected-shards 6 --poll-seconds 15 --deadline-seconds 10500

  shard:
    needs: arm
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    environment:
      name: production
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard-index: [0, 1, 2, 3, 4, 5]
    env:
      PATHLAB_CLASSROOM_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      PATHLAB_CLASSROOM_ADMIN_USERNAME: ${{ secrets.LOAD_TEST_ADMIN_USERNAME }}
      PATHLAB_CLASSROOM_ADMIN_PASSWORD: ${{ secrets.LOAD_TEST_ADMIN_PASSWORD }}
      PATHLAB_CLASSROOM_PROTECTED_REMOTE: "true"
      PATHLAB_CLASSROOM_SYNTHETIC_ONLY: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: capacity-plan
          path: ${{ runner.temp }}/capacity-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: capacity-fixtures-private
          path: ${{ runner.temp }}/capacity-fixtures-private
      - name: Mask protected identifiers and install locked dependencies
        run: |
          set -euo pipefail
          for value in "${PATHLAB_CLASSROOM_BASE_URL}" \
            "${PATHLAB_CLASSROOM_ADMIN_USERNAME}" "${PATHLAB_CLASSROOM_ADMIN_PASSWORD}"; do
            test -n "${value}"
            echo "::add-mask::${value}"
          done
          pip install --require-hashes -r deploy/backend-requirements.txt
          pip install --require-hashes -r deploy/oci-cli-requirements.txt
      - name: Materialize synthetic DZI request plan
        env:
          DEPLOY_EVIDENCE_KEY: ${{ secrets.PATHLAB_DEPLOY_EVIDENCE_KEY }}
        run: |
          set -euo pipefail
          python deploy/scripts/capacity_fixtures.py materialize \
            --input "${RUNNER_TEMP}/capacity-fixtures-private/capacity-fixtures.fernet" \
            --output-dir "${RUNNER_TEMP}/capacity-fixtures" \
            --evidence-key "${DEPLOY_EVIDENCE_KEY}" --run-id "${GITHUB_RUN_ID}" \
            --workflow-sha "${GITHUB_SHA}"
          cp "${RUNNER_TEMP}/capacity-fixtures/media-manifest.json" "${RUNNER_TEMP}/media-manifest.json"
          cp "${RUNNER_TEMP}/capacity-fixtures/stage-manifest.json" "${RUNNER_TEMP}/stage-manifest.json"
          jq -r '.. | strings' "${RUNNER_TEMP}/stage-manifest.json" | \
            while IFS= read -r value; do echo "::add-mask::${value}"; done
          echo "PATHLAB_CLASSROOM_MEDIA_MANIFEST=${RUNNER_TEMP}/media-manifest.json" >> "${GITHUB_ENV}"
          echo "PATHLAB_CLASSROOM_STAGE_MANIFEST=${RUNNER_TEMP}/stage-manifest.json" >> "${GITHUB_ENV}"
      - name: Configure pinned OCI observer access
        if: matrix.shard-index == 0
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_BASTION_KNOWN_HOSTS: ${{ secrets.OCI_BASTION_KNOWN_HOSTS }}
          OCI_TARGET_DEPLOY_KEY: ${{ secrets.OCI_TARGET_DEPLOY_KEY }}
          OCI_TARGET_KNOWN_HOSTS: ${{ secrets.OCI_TARGET_KNOWN_HOSTS }}
        run: |
          pip install --require-hashes -r deploy/oci-cli-requirements.txt
          bash deploy/scripts/configure-capacity-oci.sh
      - name: Start continuous run-bound host observer
        if: matrix.shard-index == 0
        env:
          OCI_BASTION_ID: ${{ vars.OCI_BASTION_ID }}
          OCI_INSTANCE_ID: ${{ vars.OCI_INSTANCE_ID }}
          OCI_TARGET_PRIVATE_IP: ${{ vars.OCI_TARGET_PRIVATE_IP }}
          OCI_KNOWN_HOSTS_FILE: /home/runner/.ssh/known_hosts
        run: |
          set -euo pipefail
          (
            set +e
            bash deploy/scripts/run-capacity-observer.sh \
              "${RUNNER_TEMP}/capacity-plan/capacity-plan.json" \
              "${RUNNER_TEMP}/capacity-host-samples.jsonl"
            observer_status="$?"
            printf '%s\n' "${observer_status}" > "${RUNNER_TEMP}/capacity-observer.status"
            exit "${observer_status}"
          ) > "${RUNNER_TEMP}/capacity-observer-private.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/capacity-observer.pid"
      - name: Run synchronized aggregate-only shard
        run: |
          python tests/load/distributed_shard.py \
            --plan "${RUNNER_TEMP}/capacity-plan/capacity-plan.json" \
            --shard-index "${{ matrix.shard-index }}" \
            --output "${RUNNER_TEMP}/shard-${{ matrix.shard-index }}.json"
      - name: Require complete continuous host observer
        if: matrix.shard-index == 0
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            [[ -f "${RUNNER_TEMP}/capacity-observer.status" ]] && break
            sleep 5
          done
          test "$(cat "${RUNNER_TEMP}/capacity-observer.status")" = 0
          test -s "${RUNNER_TEMP}/capacity-host-samples.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: capacity-shard-${{ matrix.shard-index }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard-index }}.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.shard-index == 0
        with:
          name: capacity-observer
          path: ${{ runner.temp }}/capacity-host-samples.jsonl
          if-no-files-found: error
          retention-days: 1
      - if: always() && matrix.shard-index == 0
        run: rm -rf -- ~/.oci ~/.ssh; rm -f -- "${RUNNER_TEMP}/capacity-observer-private.log"
      - if: always()
        run: rm -rf -- "${RUNNER_TEMP}/capacity-fixtures" "${RUNNER_TEMP}/capacity-fixtures-private"

  sentinels:
    needs: [preflight, fixtures, arm]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: capacity-plan, path: "${{ runner.temp }}/capacity-plan"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: capacity-fixtures-private, path: "${{ runner.temp }}/capacity-fixtures-private"}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install --require-hashes -r deploy/oci-cli-requirements.txt
      - name: Materialize exact run-owned sentinel fixtures
        env:
          DEPLOY_EVIDENCE_KEY: ${{ secrets.PATHLAB_DEPLOY_EVIDENCE_KEY }}
        run: |
          set -euo pipefail
          python deploy/scripts/capacity_fixtures.py materialize \
            --input "${RUNNER_TEMP}/capacity-fixtures-private/capacity-fixtures.fernet" \
            --output-dir "${RUNNER_TEMP}/capacity-fixtures" \
            --evidence-key "${DEPLOY_EVIDENCE_KEY}" --run-id "${GITHUB_RUN_ID}" \
            --workflow-sha "${GITHUB_SHA}"
          while IFS= read -r value; do echo "::add-mask::${value}"; done \
            < <(jq -r '.. | strings' "${RUNNER_TEMP}/capacity-fixtures/fixture-private.json")
          echo "CAPACITY_ANNOTATION_SLIDE_ID=$(jq -er .annotationSlideId "${RUNNER_TEMP}/capacity-fixtures/sentinels.json")" >> "${GITHUB_ENV}"
          echo "CAPACITY_SHARE_TARGET_ID=$(jq -er .shareTargetId "${RUNNER_TEMP}/capacity-fixtures/sentinels.json")" >> "${GITHUB_ENV}"
          echo "CAPACITY_DYNAMIC_PUBLIC_ID=$(jq -er .dynamicPublicId "${RUNNER_TEMP}/capacity-fixtures/sentinels.json")" >> "${GITHUB_ENV}"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: "24.14.0", cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium firefox webkit
      - name: Generate sparse synthetic 330-MB OME-TIFF
        run: |
          python tests/load/generate_synthetic_ome.py \
            --output "${RUNNER_TEMP}/synthetic-capacity-330mb.ome.tiff"
          test "$(wc -c < "${RUNNER_TEMP}/synthetic-capacity-330mb.ome.tiff")" -ge 330000000
      - name: Run concurrent full-feature synthetic sentinels
        env:
          GH_TOKEN: ${{ github.token }}
          CAPACITY_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          LOAD_TEST_ADMIN_USERNAME: ${{ secrets.LOAD_TEST_ADMIN_USERNAME }}
          LOAD_TEST_ADMIN_PASSWORD: ${{ secrets.LOAD_TEST_ADMIN_PASSWORD }}
          CAPACITY_SYNTHETIC_330MB: ${{ runner.temp }}/synthetic-capacity-330mb.ome.tiff
          CAPACITY_SENTINEL_RESULT: ${{ runner.temp }}/capacity-sentinel.json
          CAPACITY_CLASSROOM_STAGE_MANIFEST_JSON: ${{ runner.temp }}/sentinel-stage-manifest.json
        run: |
          cp "${RUNNER_TEMP}/capacity-fixtures/stage-manifest.json" "${RUNNER_TEMP}/sentinel-stage-manifest.json"
          export CAPACITY_CLASSROOM_JOIN_CODE="$(jq -er '.["sustained-1200"]["join" + "Code"]' "${RUNNER_TEMP}/sentinel-stage-manifest.json")"
          export CAPACITY_CLASSROOM_SESSION_ID="$(jq -er '.["sustained-1200"]["session" + "Id"]' "${RUNNER_TEMP}/sentinel-stage-manifest.json")"
          echo "::add-mask::${CAPACITY_CLASSROOM_JOIN_CODE}"
          echo "::add-mask::${CAPACITY_CLASSROOM_SESSION_ID}"
          printf '{}\n' > "${CAPACITY_SENTINEL_RESULT}"
          bash deploy/scripts/run-capacity-sentinels.sh "${RUNNER_TEMP}/capacity-plan/capacity-plan.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: capacity-sentinels
          path: ${{ runner.temp }}/capacity-sentinel.json
          if-no-files-found: error
          retention-days: 1
      - if: always()
        run: rm -rf -- "${RUNNER_TEMP}/capacity-fixtures" "${RUNNER_TEMP}/capacity-fixtures-private"

  fault-recovery:
    needs: [fixtures, arm]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: capacity-plan, path: "${{ runner.temp }}/capacity-plan"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: capacity-fixtures-private, path: "${{ runner.temp }}/capacity-fixtures-private"}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install --require-hashes -r deploy/oci-cli-requirements.txt
      - name: Materialize exact run-owned recovery fixture
        env:
          DEPLOY_EVIDENCE_KEY: ${{ secrets.PATHLAB_DEPLOY_EVIDENCE_KEY }}
        run: |
          python deploy/scripts/capacity_fixtures.py materialize \
            --input "${RUNNER_TEMP}/capacity-fixtures-private/capacity-fixtures.fernet" \
            --output-dir "${RUNNER_TEMP}/capacity-fixtures" \
            --evidence-key "${DEPLOY_EVIDENCE_KEY}" --run-id "${GITHUB_RUN_ID}" \
            --workflow-sha "${GITHUB_SHA}"
          jq -r '.. | strings' "${RUNNER_TEMP}/capacity-fixtures/fixture-private.json" | \
            while IFS= read -r value; do echo "::add-mask::${value}"; done
      - name: Configure pinned OCI access
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_BASTION_KNOWN_HOSTS: ${{ secrets.OCI_BASTION_KNOWN_HOSTS }}
          OCI_TARGET_DEPLOY_KEY: ${{ secrets.OCI_TARGET_DEPLOY_KEY }}
          OCI_TARGET_KNOWN_HOSTS: ${{ secrets.OCI_TARGET_KNOWN_HOSTS }}
        run: bash deploy/scripts/configure-capacity-oci.sh
      - name: Wedge only Classroom and prove bounded recovery
        env:
          GH_TOKEN: ${{ github.token }}
          CAPACITY_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          OCI_BASTION_ID: ${{ vars.OCI_BASTION_ID }}
          OCI_INSTANCE_ID: ${{ vars.OCI_INSTANCE_ID }}
          OCI_TARGET_PRIVATE_IP: ${{ vars.OCI_TARGET_PRIVATE_IP }}
          OCI_KNOWN_HOSTS_FILE: /home/runner/.ssh/known_hosts
          CAPACITY_FAULT_RESULT: ${{ runner.temp }}/capacity-fault.json
          LOAD_TEST_ADMIN_USERNAME: ${{ secrets.LOAD_TEST_ADMIN_USERNAME }}
          LOAD_TEST_ADMIN_PASSWORD: ${{ secrets.LOAD_TEST_ADMIN_PASSWORD }}
        run: |
          cp "${RUNNER_TEMP}/capacity-fixtures/stage-manifest.json" "${RUNNER_TEMP}/stage-manifest.json"
          export CAPACITY_CLASSROOM_SESSION_ID="$(jq -er '."recovery-1200".sessionId' "${RUNNER_TEMP}/stage-manifest.json")"
          echo "::add-mask::${CAPACITY_CLASSROOM_SESSION_ID}"
          bash deploy/scripts/run-capacity-fault-recovery.sh "${RUNNER_TEMP}/capacity-plan/capacity-plan.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: capacity-fault
          path: ${{ runner.temp }}/capacity-fault.json
          if-no-files-found: error
          retention-days: 1
      - if: always()
        run: rm -rf -- ~/.oci ~/.ssh "${RUNNER_TEMP}/capacity-fixtures" "${RUNNER_TEMP}/capacity-fixtures-private"

  decision:
    if: ${{ always() && needs.preflight.result == 'success' && needs.fixtures.result == 'success' }}
    needs: [preflight, fixtures, arm, failure-watchdog, shard, sentinels, fault-recovery]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: "capacity-*", path: "${{ runner.temp }}/evidence", merge-multiple: true}
      - name: Require and merge every shard before selecting a tier
        id: merge
        continue-on-error: true
        run: |
          test "${{ needs.failure-watchdog.result }}" = success
          remaining="$(python deploy/scripts/capacity_window.py \
            --plan "${RUNNER_TEMP}/evidence/capacity-plan.json" remaining --phase decision)"
          timeout --signal=TERM --kill-after=10s "${remaining}s" \
            python tests/load/distributed_certification.py merge \
            --plan "${RUNNER_TEMP}/evidence/capacity-plan.json" \
            --shard "${RUNNER_TEMP}/evidence/shard-0.json" \
            --shard "${RUNNER_TEMP}/evidence/shard-1.json" \
            --shard "${RUNNER_TEMP}/evidence/shard-2.json" \
            --shard "${RUNNER_TEMP}/evidence/shard-3.json" \
            --shard "${RUNNER_TEMP}/evidence/shard-4.json" \
            --shard "${RUNNER_TEMP}/evidence/shard-5.json" \
            --output "${RUNNER_TEMP}/merged-shards.json"
      - name: Build signed provisional decision
        if: always()
        env:
          DEPLOY_EVIDENCE_KEY: ${{ secrets.PATHLAB_DEPLOY_EVIDENCE_KEY }}
        run: |
          key="${RUNNER_TEMP}/capacity-evidence.key"
          install -m 600 /dev/null "${key}"
          printf '%s' "${DEPLOY_EVIDENCE_KEY}" > "${key}"
          nonce="$(python -c 'import hashlib,hmac,os; print(hmac.new(os.environ["DEPLOY_EVIDENCE_KEY"].encode(), (os.environ["GITHUB_RUN_ID"]+":"+os.environ["GITHUB_RUN_ATTEMPT"]).encode(), hashlib.sha256).hexdigest())')"
          echo "::add-mask::${nonce}"
          if [[ "${{ steps.merge.outcome }}" == success ]] && \
             remaining="$(python deploy/scripts/capacity_window.py \
               --plan "${RUNNER_TEMP}/evidence/capacity-plan.json" remaining --phase decision)" && \
             timeout --signal=TERM --kill-after=10s "${remaining}s" \
               python tests/load/build_capacity_decision.py \
              --plan "${RUNNER_TEMP}/evidence/capacity-plan.json" \
              --merged-shards "${RUNNER_TEMP}/merged-shards.json" \
              --sentinels "${RUNNER_TEMP}/evidence/capacity-sentinel.json" \
              --fault "${RUNNER_TEMP}/evidence/capacity-fault.json" \
              --observer "${RUNNER_TEMP}/evidence/capacity-host-samples.jsonl" \
              --accounting "${RUNNER_TEMP}/evidence/capacity-accounting.json" \
              --nonce "${nonce}" --key-file "${key}" \
              --output "${RUNNER_TEMP}/capacity-decision.json" \
              --signature-output "${RUNNER_TEMP}/capacity-decision.json.sig"; then
            :
          else
            rm -f -- "${RUNNER_TEMP}/capacity-decision.json" "${RUNNER_TEMP}/capacity-decision.json.sig"
            echo "NOT CERTIFIED: required evidence missing or invalid; restoring same-release safety floor"
            remaining="$(python deploy/scripts/capacity_window.py \
              --plan "${RUNNER_TEMP}/evidence/capacity-plan.json" remaining --phase decision)"
            timeout --signal=TERM --kill-after=10s "${remaining}s" \
              python tests/load/build_failure_decision.py \
              --plan "${RUNNER_TEMP}/evidence/capacity-plan.json" \
              --sentinels "${RUNNER_TEMP}/evidence/capacity-sentinel.json" \
              --nonce "${nonce}" --key-file "${key}" \
              --output "${RUNNER_TEMP}/capacity-decision.json" \
              --signature-output "${RUNNER_TEMP}/capacity-decision.json.sig"
          fi
          rm -f -- "${key}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: capacity-decision
          path: |
            ${{ runner.temp }}/capacity-decision.json
            ${{ runner.temp }}/capacity-decision.json.sig
          if-no-files-found: error
          retention-days: 1

  cleanup:
    if: ${{ always() && needs.preflight.result == 'success' && needs.fixtures.result == 'success' }}
    needs: [preflight, fixtures, shard, sentinels, fault-recovery, decision]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install --require-hashes -r deploy/oci-cli-requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: "capacity-*", path: "${{ runner.temp }}/evidence", merge-multiple: true}
      - name: Configure pinned OCI access
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_BASTION_KNOWN_HOSTS: ${{ secrets.OCI_BASTION_KNOWN_HOSTS }}
          OCI_TARGET_DEPLOY_KEY: ${{ secrets.OCI_TARGET_DEPLOY_KEY }}
          OCI_TARGET_KNOWN_HOSTS: ${{ secrets.OCI_TARGET_KNOWN_HOSTS }}
        run: bash deploy/scripts/configure-capacity-oci.sh
      - name: Restore capacity configuration and remove every synthetic fixture
        env:
          CAPACITY_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          LOAD_TEST_ADMIN_USERNAME: ${{ secrets.LOAD_TEST_ADMIN_USERNAME }}
          LOAD_TEST_ADMIN_PASSWORD: ${{ secrets.LOAD_TEST_ADMIN_PASSWORD }}
          CAPACITY_CLEANUP_RESULT: ${{ runner.temp }}/capacity-cleanup.json
          CAPACITY_RUNTIME_RESULT: ${{ runner.temp }}/capacity-runtime-restoration.json
          DEPLOY_EVIDENCE_KEY: ${{ secrets.PATHLAB_DEPLOY_EVIDENCE_KEY }}
          OCI_BASTION_ID: ${{ vars.OCI_BASTION_ID }}
          OCI_INSTANCE_ID: ${{ vars.OCI_INSTANCE_ID }}
          OCI_TARGET_PRIVATE_IP: ${{ vars.OCI_TARGET_PRIVATE_IP }}
          OCI_KNOWN_HOSTS_FILE: /home/runner/.ssh/known_hosts
        run: |
          export CAPACITY_PRIVATE_FIXTURE_BUNDLE="${RUNNER_TEMP}/evidence/capacity-fixtures.fernet"
          remaining="$(python deploy/scripts/capacity_window.py \
            --plan "${RUNNER_TEMP}/evidence/capacity-plan.json" remaining --phase cleanup)"
          timeout --signal=TERM --kill-after=250s "${remaining}s" \
            bash deploy/scripts/cleanup-capacity-certification.sh \
              "${RUNNER_TEMP}/evidence/capacity-plan.json" \
              "${RUNNER_TEMP}/evidence/capacity-decision.json" \
              "${RUNNER_TEMP}/evidence/capacity-decision.json.sig" \
              "${RUNNER_TEMP}/evidence/capacity-sentinel.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: capacity-cleanup
          path: |
            ${{ runner.temp }}/capacity-cleanup.json
            ${{ runner.temp }}/capacity-runtime-restoration.json
          if-no-files-found: error
          retention-days: 1
      - if: always()
        run: rm -rf -- ~/.oci ~/.ssh

  postflight:
    if: ${{ always() && needs.cleanup.result != 'skipped' }}
    needs: [preflight, decision, cleanup]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install --require-hashes -r deploy/oci-cli-requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: "capacity-*", path: "${{ runner.temp }}/evidence", merge-multiple: true}
      - name: Configure pinned OCI access
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_BASTION_KNOWN_HOSTS: ${{ secrets.OCI_BASTION_KNOWN_HOSTS }}
          OCI_TARGET_DEPLOY_KEY: ${{ secrets.OCI_TARGET_DEPLOY_KEY }}
          OCI_TARGET_KNOWN_HOSTS: ${{ secrets.OCI_TARGET_KNOWN_HOSTS }}
        run: bash deploy/scripts/configure-capacity-oci.sh
      - name: Verify exact release, manifest topology, endpoints, watchdog, and safety floor
        env:
          CAPACITY_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          OCI_BASTION_ID: ${{ vars.OCI_BASTION_ID }}
          OCI_INSTANCE_ID: ${{ vars.OCI_INSTANCE_ID }}
          OCI_TARGET_PRIVATE_IP: ${{ vars.OCI_TARGET_PRIVATE_IP }}
          OCI_KNOWN_HOSTS_FILE: /home/runner/.ssh/known_hosts
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP}/evidence/capacity-plan.json"
          bounded() {
            local remaining
            remaining="$(python deploy/scripts/capacity_window.py \
              --plan "${plan}" remaining --phase postflight)" || return $?
            timeout --signal=TERM --kill-after=10s "${remaining}s" "$@"
          }
          decision="${RUNNER_TEMP}/evidence/capacity-decision.json"
          expected_sha="${GITHUB_SHA}"
          manifest_digest="$(jq -er .runtimeManifestDigest \
            "${RUNNER_TEMP}/evidence/capacity-runtime-preflight.json")"
          if [[ -s "${RUNNER_TEMP}/evidence/capacity-runtime-restoration.json" ]]; then
            host="$(cat "${RUNNER_TEMP}/evidence/capacity-runtime-restoration.json")"
          else
            host="$(bounded bash deploy/scripts/capacity-control-via-bastion.sh \
              "capacity-postflight expected=${expected_sha} manifest=${manifest_digest}")"
          fi
          bounded curl --fail --silent --show-error --max-time 15 "${CAPACITY_BASE_URL%/}/readyz" >/dev/null
          bounded curl --fail --silent --show-error --max-time 15 "${CAPACITY_BASE_URL%/}/livez" >/dev/null
          tenancy_id="$(awk -F= '/^tenancy=/{print $2; exit}' ~/.oci/config)"
          usage_end="$(date -u +%Y-%m-%dT00:00:00Z)"
          cost_json="$(bounded oci usage-api usage-summary request-summarized-usages \
            --tenant-id "${tenancy_id}" --granularity MONTHLY --query-type COST \
            --time-usage-started "$(date -u +%Y-%m-01T00:00:00Z)" \
            --time-usage-ended "${usage_end}")"
          cost="$(jq '[.data.items[]? | (."computed-amount" // 0 | tonumber)] | add // 0' <<< "${cost_json}")"
          jq -n --arg runId "$(jq -r .runId "${plan}")" --arg workflowSha "${GITHUB_SHA}" \
            --arg planDigest "$(jq -r .planDigest "${plan}")" --arg observedAt "$(date --iso-8601=seconds)" \
            --arg expectedSha "${expected_sha}" --arg deployedSha "$(jq -r .releaseSha <<< "${host}")" \
            --arg runtimeManifestDigest "$(jq -r .runtimeManifestDigest <<< "${host}")" \
            --arg schemaRevision "$(jq -r .schemaRevision <<< "${host}")" \
            --arg databaseEngine "$(jq -r .databaseEngine <<< "${host}")" \
            --argjson services "$(jq .services <<< "${host}")" \
            --argjson releaseExact "$(jq .releaseExact <<< "${host}")" --argjson servicesExact "$(jq .servicesExact <<< "${host}")" \
            --argjson serviceCount "$(jq .serviceCount <<< "${host}")" --argjson ready "$(jq .ready <<< "${host}")" \
            --argjson watchdogExpected "$(jq .watchdogExpected <<< "${host}")" \
            --argjson watchdogActive "$(jq .watchdogActive <<< "${host}")" \
            --argjson capacity "$(jq .finalCapacity <<< "${host}")" --argjson cost "${cost}" \
            --argjson annotationsEnabled "$(jq .annotationsEnabled <<< "${host}")" \
            '{schemaVersion:1,runId:$runId,workflowSha:$workflowSha,planDigest:$planDigest,observedAt:$observedAt,
              expectedSha:$expectedSha,deployedSha:$deployedSha,runtimeManifestDigest:$runtimeManifestDigest,
              schemaRevision:$schemaRevision,databaseEngine:$databaseEngine,services:$services,
              releaseExact:$releaseExact,servicesExact:$servicesExact,
              serviceCount:$serviceCount,hostReady:$ready,endpointsHealthy:true,watchdogExpected:$watchdogExpected,
              watchdogActive:$watchdogActive,finalCapacity:$capacity,annotationsEnabled:$annotationsEnabled,
              monthToDateCost:$cost,currency:"SGD",aggregateOnly:true}' \
            > "${RUNNER_TEMP}/capacity-postflight.json"
          test "$(jq -r .finalCapacity "${RUNNER_TEMP}/capacity-postflight.json")" = 300
          test "$(jq -r .annotationsEnabled "${RUNNER_TEMP}/capacity-postflight.json")" = false
          python tests/load/validate_postflight_evidence.py "${RUNNER_TEMP}/capacity-postflight.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: {name: capacity-postflight, path: "${{ runner.temp }}/capacity-postflight.json", if-no-files-found: error, retention-days: 1}
      - if: always()
        run: rm -rf -- ~/.oci ~/.ssh

  aggregate:
    if: ${{ always() && needs.postflight.result == 'success' }}
    needs: [preflight, fixtures, shard, sentinels, fault-recovery, cleanup, postflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: capacity-*
          path: ${{ runner.temp }}/evidence
          merge-multiple: true
      - name: Merge all six synchronized shards
        id: final-merge
        continue-on-error: true
        run: |
          remaining="$(python deploy/scripts/capacity_window.py \
            --plan "${RUNNER_TEMP}/evidence/capacity-plan.json" remaining --phase aggregate)"
          timeout --signal=TERM --kill-after=10s "${remaining}s" \
            python tests/load/distributed_certification.py merge \
            --plan "${RUNNER_TEMP}/evidence/capacity-plan.json" \
            --shard "${RUNNER_TEMP}/evidence/shard-0.json" \
            --shard "${RUNNER_TEMP}/evidence/shard-1.json" \
            --shard "${RUNNER_TEMP}/evidence/shard-2.json" \
            --shard "${RUNNER_TEMP}/evidence/shard-3.json" \
            --shard "${RUNNER_TEMP}/evidence/shard-4.json" \
            --shard "${RUNNER_TEMP}/evidence/shard-5.json" \
            --output "${RUNNER_TEMP}/evidence/merged-shards.json"
      - name: Verify signed decision and select aggregate route
        id: signed-decision
        env:
          DEPLOY_EVIDENCE_KEY: ${{ secrets.PATHLAB_DEPLOY_EVIDENCE_KEY }}
        run: |
          remaining="$(python deploy/scripts/capacity_window.py \
            --plan "${RUNNER_TEMP}/evidence/capacity-plan.json" remaining --phase aggregate)"
          key="${RUNNER_TEMP}/decision-route.key"
          install -m 600 /dev/null "${key}"
          printf '%s' "${DEPLOY_EVIDENCE_KEY}" > "${key}"
          route="$(timeout --signal=TERM --kill-after=10s "${remaining}s" \
            python tests/load/build_failure_evidence.py verify-decision \
            --plan "${RUNNER_TEMP}/evidence/capacity-plan.json" \
            --decision "${RUNNER_TEMP}/evidence/capacity-decision.json" \
            --signature "${RUNNER_TEMP}/evidence/capacity-decision.json.sig" \
            --key-file "${key}")"
          echo "selected=$(jq -er .selectedCapacity <<< "${route}")" >> "${GITHUB_OUTPUT}"
          echo "verdict=$(jq -er .verdict <<< "${route}")" >> "${GITHUB_OUTPUT}"
          rm -f -- "${key}"
      - name: Build and validate fail-closed evidence v2
        if: steps.signed-decision.outputs.selected != '300'
        env:
          CAPACITY_BROWSER_CI_RUN_ID: ${{ needs.preflight.outputs.browser-ci-run-id }}
        run: |
          remaining="$(python deploy/scripts/capacity_window.py \
            --plan "${RUNNER_TEMP}/evidence/capacity-plan.json" remaining --phase aggregate)"
          timeout --signal=TERM --kill-after=10s "${remaining}s" \
            python tests/load/build_distributed_evidence.py \
            --plan "${RUNNER_TEMP}/evidence/capacity-plan.json" \
            --merged-shards "${RUNNER_TEMP}/evidence/merged-shards.json" \
            --sentinels "${RUNNER_TEMP}/evidence/capacity-sentinel.json" \
            --fault "${RUNNER_TEMP}/evidence/capacity-fault.json" \
            --fixture-preparation "${RUNNER_TEMP}/evidence/capacity-fixture-status.json" \
            --cleanup "${RUNNER_TEMP}/evidence/capacity-cleanup.json" \
            --observer "${RUNNER_TEMP}/evidence/capacity-host-samples.jsonl" \
            --accounting "${RUNNER_TEMP}/evidence/capacity-accounting.json" \
            --postflight "${RUNNER_TEMP}/evidence/capacity-postflight.json" \
            --output-json "${RUNNER_TEMP}/capacity-certification.json" \
            --output-markdown "${RUNNER_TEMP}/capacity-certification.md"
      - name: Build aggregate NOT CERTIFIED evidence v2 after strict shard failure
        if: steps.signed-decision.outputs.selected == '300' && steps.signed-decision.outputs.verdict == 'NOT CERTIFIED'
        env:
          DEPLOY_EVIDENCE_KEY: ${{ secrets.PATHLAB_DEPLOY_EVIDENCE_KEY }}
        run: |
          remaining="$(python deploy/scripts/capacity_window.py \
            --plan "${RUNNER_TEMP}/evidence/capacity-plan.json" remaining --phase aggregate)"
          key="${RUNNER_TEMP}/failure-evidence.key"
          install -m 600 /dev/null "${key}"
          printf '%s' "${DEPLOY_EVIDENCE_KEY}" > "${key}"
          timeout --signal=TERM --kill-after=10s "${remaining}s" \
            python tests/load/build_failure_evidence.py \
            --plan "${RUNNER_TEMP}/evidence/capacity-plan.json" \
            --decision "${RUNNER_TEMP}/evidence/capacity-decision.json" \
            --signature "${RUNNER_TEMP}/evidence/capacity-decision.json.sig" --key-file "${key}" \
            --fixture-preparation "${RUNNER_TEMP}/evidence/capacity-fixture-status.json" \
            --postflight "${RUNNER_TEMP}/evidence/capacity-postflight.json" \
            --output-json "${RUNNER_TEMP}/capacity-certification.json" \
            --output-markdown "${RUNNER_TEMP}/capacity-certification.md"
          rm -f -- "${key}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capacity-certification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/capacity-certification.json
            ${{ runner.temp }}/capacity-certification.md
          if-no-files-found: error
          retention-days: 14
      - run: cat "${RUNNER_TEMP}/capacity-certification.md" >> "${GITHUB_STEP_SUMMARY}"

  terminal-summary:
    if: always()
    needs: [preflight, fixtures, arm, failure-watchdog, shard, sentinels, fault-recovery, decision, cleanup, postflight, aggregate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with: {pattern: "capacity-*", path: "${{ runner.temp }}/evidence", merge-multiple: true}
      - name: Write compact terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          started_at="$(timeout --signal=TERM --kill-after=5s 20s gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --jq .run_started_at 2>/dev/null || true)"
          python tests/load/build_capacity_terminal_status.py \
            --evidence "${RUNNER_TEMP}/evidence" \
            --output "${RUNNER_TEMP}/capacity-status.json" --started-at "${started_at}"
          jq '{state,releaseSha,failureCode,restorationState,fixtureCount,
            runOwnedBastionCount,progressCounters}' "${RUNNER_TEMP}/capacity-status.json" \
            >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: capacity-terminal-status
          path: ${{ runner.temp }}/capacity-status.json
          if-no-files-found: error
          retention-days: 14
