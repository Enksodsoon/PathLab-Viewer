name: Dependabot test sync fix

on:
  push:
    branches:
      - dependabot/npm_and_yarn/web-dependencies-dbd5506ffe
    paths:
      - ".github/workflows/dependabot-test-sync-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dependabot/npm_and_yarn/web-dependencies-dbd5506ffe
      - name: Synchronize the expanded annotation assertion
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/test/viewer.test.tsx')
          text = path.read_text(encoding='utf-8')
          old = "  expect(screen.getByRole('button', { name: 'Point marker' })).toBeVisible()\n"
          new = "  expect(await screen.findByRole('button', { name: 'Point marker' })).toBeVisible()\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit the test synchronization only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/test/viewer.test.tsx
          git diff --cached --check
          git diff --cached --exit-code && exit 0 || true
          git commit -m "test: await expanded annotation tools"
          git push origin HEAD:dependabot/npm_and_yarn/web-dependencies-dbd5506ffe
