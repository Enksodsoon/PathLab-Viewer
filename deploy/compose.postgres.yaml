services:
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_compression=on
    environment:
      POSTGRES_DB: ${PATHLAB_POSTGRES_DB:?Set PATHLAB_POSTGRES_DB}
      POSTGRES_USER: ${PATHLAB_POSTGRES_USER:?Set PATHLAB_POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/pathlab-postgres-password
    secrets:
      - pathlab-postgres-password
    volumes:
      - pathlab-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 768m
    cpus: 0.75
    cpu_shares: 1024

  api:
    environment:
      PATHLAB_DATABASE_URL: postgresql+psycopg://${PATHLAB_POSTGRES_USER:?Set PATHLAB_POSTGRES_USER}@postgres:5432/${PATHLAB_POSTGRES_DB:?Set PATHLAB_POSTGRES_DB}
      PATHLAB_DATABASE_PASSWORD_FILE: /run/secrets/pathlab-postgres-password
    secrets:
      - pathlab-postgres-password
    depends_on:
      postgres:
        condition: service_healthy

  classroom:
    environment:
      PATHLAB_DATABASE_URL: postgresql+psycopg://${PATHLAB_POSTGRES_USER:?Set PATHLAB_POSTGRES_USER}@postgres:5432/${PATHLAB_POSTGRES_DB:?Set PATHLAB_POSTGRES_DB}
      PATHLAB_DATABASE_PASSWORD_FILE: /run/secrets/pathlab-postgres-password
    secrets:
      - pathlab-postgres-password

  worker:
    environment:
      PATHLAB_DATABASE_URL: postgresql+psycopg://${PATHLAB_POSTGRES_USER:?Set PATHLAB_POSTGRES_USER}@postgres:5432/${PATHLAB_POSTGRES_DB:?Set PATHLAB_POSTGRES_DB}
      PATHLAB_DATABASE_PASSWORD_FILE: /run/secrets/pathlab-postgres-password
    secrets:
      - pathlab-postgres-password

volumes:
  pathlab-postgres:

secrets:
  pathlab-postgres-password:
    file: ${PATHLAB_POSTGRES_PASSWORD_FILE:?Set PATHLAB_POSTGRES_PASSWORD_FILE}
