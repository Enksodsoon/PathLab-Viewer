name: Dependabot lock refresh

on:
  push:
    branches:
      - dependabot/npm_and_yarn/web-dependencies-dbd5506ffe
    paths:
      - ".github/workflows/dependabot-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dependabot/npm_and_yarn/web-dependencies-dbd5506ffe
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - run: pnpm peers check
      - name: Commit regenerated lockfile only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: regenerate web dependency lock"
          git push origin HEAD:dependabot/npm_and_yarn/web-dependencies-dbd5506ffe
