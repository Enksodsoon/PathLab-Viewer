name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  deployments: write

concurrency:
  group: production-control
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Mask production infrastructure identifiers
        env:
          MASK_OCI_BASTION_ID: ${{ vars.OCI_BASTION_ID }}
          MASK_OCI_INSTANCE_ID: ${{ vars.OCI_INSTANCE_ID }}
          MASK_OCI_TARGET_PRIVATE_IP: ${{ vars.OCI_TARGET_PRIVATE_IP }}
        run: |
          for value in \
            "${MASK_OCI_BASTION_ID}" \
            "${MASK_OCI_INSTANCE_ID}" \
            "${MASK_OCI_TARGET_PRIVATE_IP}"
          do
            if [[ -n "${value}" ]]; then
              echo "::add-mask::${value}"
            fi
          done

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate production deployment configuration
        env:
          DEPLOY_EVIDENCE_KEY: ${{ secrets.PATHLAB_DEPLOY_EVIDENCE_KEY }}
          PROJECTED_EGRESS_BYTES: ${{ vars.OCI_PROJECTED_MONTHLY_EGRESS_BYTES }}
        run: |
          [[ "${#DEPLOY_EVIDENCE_KEY}" -ge 32 ]] || {
            echo "PATHLAB_DEPLOY_EVIDENCE_KEY is missing or too short in the production environment." >&2
            exit 1
          }
          [[ "${PROJECTED_EGRESS_BYTES}" =~ ^[0-9]+$ ]] || {
            echo "OCI_PROJECTED_MONTHLY_EGRESS_BYTES must be an integer in the production environment." >&2
            exit 1
          }
          [[ "${PROJECTED_EGRESS_BYTES}" -lt 9000000000000 ]] || {
            echo "OCI_PROJECTED_MONTHLY_EGRESS_BYTES must remain below the 9 TB guard." >&2
            exit 1
          }

      - name: Require successful CI checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            > "${RUNNER_TEMP}/check-runs.json"
          for check in backend browser web containers repository-and-dependencies \
            'CodeQL (python)' 'CodeQL (javascript-typescript)'; do
            conclusion="$(jq -r --arg name "${check}" --arg sha "${GITHUB_SHA}" \
              '[.check_runs[] | select(.name == $name and .head_sha == $sha)] | sort_by(.id) | last | .conclusion // empty' \
              "${RUNNER_TEMP}/check-runs.json")"
            test "${conclusion}" = success || {
              echo "Required check ${check} is ${conclusion:-missing}, not successful."
              exit 1
            }
          done

      - name: Install OCI CLI
        run: pip install --require-hashes -r deploy/oci-cli-requirements.txt

      - name: Configure OCI and pinned SSH identities
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_BASTION_KNOWN_HOSTS: ${{ secrets.OCI_BASTION_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.oci
          install -m 600 /dev/null ~/.oci/config
          install -m 600 /dev/null ~/.oci/oci_api_key.pem
          printf '%s\n' "${OCI_CONFIG}" > ~/.oci/config
          printf '%s\n' "${OCI_API_PRIVATE_KEY}" > ~/.oci/oci_api_key.pem
          install -d -m 700 ~/.ssh
          printf '%s\n' "${OCI_BASTION_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Build authenticated deployment evidence
        env:
          DEPLOY_EVIDENCE_KEY: ${{ secrets.PATHLAB_DEPLOY_EVIDENCE_KEY }}
          PROJECTED_EGRESS_BYTES: ${{ vars.OCI_PROJECTED_MONTHLY_EGRESS_BYTES }}
        run: |
          test "${PROJECTED_EGRESS_BYTES}" -ge 0
          test "${PROJECTED_EGRESS_BYTES}" -lt 9000000000000
          evidence_key="${RUNNER_TEMP}/deploy-evidence.key"
          evidence_file="${RUNNER_TEMP}/deploy-evidence.json"
          signature_file="${RUNNER_TEMP}/deploy-evidence.signature"
          install -m 600 /dev/null "${evidence_key}"
          printf '%s' "${DEPLOY_EVIDENCE_KEY}" > "${evidence_key}"
          tenancy_id="$(awk -F= '/^tenancy=/{print $2; exit}' ~/.oci/config)"
          test -n "${tenancy_id}"
          usage_start="$(date -u +%Y-%m-01T00:00:00Z)"
          usage_end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          oci usage-api usage-summary request-summarized-usages \
            --tenant-id "${tenancy_id}" --granularity MONTHLY --query-type COST \
            --time-usage-started "${usage_start}" --time-usage-ended "${usage_end}" \
            > "${RUNNER_TEMP}/oci-cost.json"
          month_cost="$(jq -r '[.data.items[]? | (."computed-amount" // 0 | tonumber)] | add // 0' \
            "${RUNNER_TEMP}/oci-cost.json")"
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date -u +%s)"
          python deploy/scripts/build_deploy_evidence.py \
            --checks "${RUNNER_TEMP}/check-runs.json" \
            --candidate-sha "${GITHUB_SHA}" --repository "${GITHUB_REPOSITORY}" \
            --workflow-run-id "${GITHUB_RUN_ID}" --nonce "${nonce}" \
            --projected-monthly-egress-bytes "${PROJECTED_EGRESS_BYTES}" \
            --month-to-date-cost-sgd "${month_cost}" --key-file "${evidence_key}" \
            --output "${evidence_file}" --signature-output "${signature_file}"
          signature="$(cat "${signature_file}")"
          echo "::add-mask::${signature}"
          echo "PATHLAB_DEPLOY_EVIDENCE_FILE=${evidence_file}" >> "${GITHUB_ENV}"
          echo "PATHLAB_DEPLOY_EVIDENCE_SIGNATURE=${signature}" >> "${GITHUB_ENV}"
          echo "PATHLAB_DEPLOY_EVIDENCE_NONCE=${nonce}" >> "${GITHUB_ENV}"

      - name: Deploy through temporary OCI Bastion session
        env:
          OCI_BASTION_ID: ${{ vars.OCI_BASTION_ID }}
          OCI_INSTANCE_ID: ${{ vars.OCI_INSTANCE_ID }}
          OCI_TARGET_PRIVATE_IP: ${{ vars.OCI_TARGET_PRIVATE_IP }}
          OCI_TARGET_USER: pathlab-deploy
          OCI_KNOWN_HOSTS_FILE: /home/runner/.ssh/known_hosts
        run: deploy/scripts/deploy-via-bastion.sh "$GITHUB_SHA"

      - name: Remove temporary cloud credentials
        if: always()
        run: |
          rm -rf -- ~/.oci ~/.ssh
          rm -f -- "${RUNNER_TEMP}/deploy-evidence.key" \
            "${RUNNER_TEMP}/deploy-evidence.json" \
            "${RUNNER_TEMP}/deploy-evidence.signature" \
            "${RUNNER_TEMP}/check-runs.json" "${RUNNER_TEMP}/oci-cost.json"
          test ! -e ~/.oci
          test ! -e ~/.ssh

      - name: Record deployment result
        run: |
          {
            echo "## Production deployment"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Result: deployed and health-checked"
          } >> "${GITHUB_STEP_SUMMARY}"
