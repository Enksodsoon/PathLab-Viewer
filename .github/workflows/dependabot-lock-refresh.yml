name: Dependabot lock refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.head_ref == 'dependabot/npm_and_yarn/web-dependencies-dbd5506ffe'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.14.0"
          cache: pnpm
      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit refreshed lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "EnkSodsoon"
          git config user.email "229880765+Enksodsoon@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build: refresh web dependency lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
