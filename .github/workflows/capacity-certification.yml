name: Capacity certification

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CERTIFY_PRODUCTION_300 to run the live production test
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: production-control
  cancel-in-progress: false

jobs:
  certify:
    if: >-
      github.ref == 'refs/heads/main'
      && inputs.confirmation == 'CERTIFY_PRODUCTION_300'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
    env:
      CAPACITY_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      LOAD_TEST_ADMIN_USERNAME: ${{ secrets.LOAD_TEST_ADMIN_USERNAME }}
      LOAD_TEST_ADMIN_PASSWORD: ${{ secrets.LOAD_TEST_ADMIN_PASSWORD }}
      CAPACITY_EVIDENCE_DIR: ${{ github.workspace }}/.capacity-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require exact main release and successful checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "${GITHUB_SHA}"
          for check in \
            backend \
            web \
            containers \
            repository-and-dependencies \
            "CodeQL (python)" \
            "CodeQL (javascript-typescript)"
          do
            conclusion="$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
                --jq ".check_runs[] | select(.name == \"${check}\") | .conclusion" |
                head -n 1
            )"
            test "${conclusion}" = success || {
              echo "Required check ${check} is ${conclusion:-missing}, not successful."
              exit 1
            }
          done

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
          cache: pnpm
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
        with:
          k6-version: "2.1.0"

      - name: Install locked runner dependencies
        run: |
          pip install --require-hashes -r deploy/oci-cli-requirements.txt
          pnpm install --frozen-lockfile
          pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Configure OCI and pinned SSH identities
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_BASTION_KNOWN_HOSTS: ${{ secrets.OCI_BASTION_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.oci
          install -m 600 /dev/null ~/.oci/config
          install -m 600 /dev/null ~/.oci/oci_api_key.pem
          printf '%s\n' "${OCI_CONFIG}" > ~/.oci/config
          printf '%s\n' "${OCI_API_PRIVATE_KEY}" > ~/.oci/oci_api_key.pem
          install -d -m 700 ~/.ssh
          printf '%s\n' "${OCI_BASTION_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run production capacity certification
        id: capacity-runner
        continue-on-error: true
        env:
          OCI_BASTION_ID: ${{ vars.OCI_BASTION_ID }}
          OCI_INSTANCE_ID: ${{ vars.OCI_INSTANCE_ID }}
          OCI_TARGET_PRIVATE_IP: ${{ vars.OCI_TARGET_PRIVATE_IP }}
          OCI_TARGET_USER: pathlab-deploy
          OCI_KNOWN_HOSTS_FILE: /home/runner/.ssh/known_hosts
        run: bash deploy/scripts/run-capacity-certification.sh

      - name: Report sanitized certification failure
        if: steps.capacity-runner.outcome == 'failure'
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          evidence = Path(os.environ["CAPACITY_EVIDENCE_DIR"])

          def sanitized_diagnostic(filename):
              path = evidence / filename
              diagnostic = {"stage": "unavailable"}
              if not path.is_file():
                  return diagnostic
              candidate = json.loads(path.read_text(encoding="utf-8"))
              stage = candidate.get("stage")
              if isinstance(stage, str) and re.fullmatch(r"[a-z0-9-]+", stage):
                  diagnostic["stage"] = stage
              status = candidate.get("httpStatus")
              if isinstance(status, int) and 100 <= status <= 599:
                  diagnostic["httpStatus"] = status
              code = candidate.get("errorCode")
              if isinstance(code, str) and re.fullmatch(r"[A-Z0-9_]{1,64}", code):
                  diagnostic["errorCode"] = code
              return diagnostic

          prepare = sanitized_diagnostic("capacity-fixture-prepare-diagnostic.json")
          cleanup = sanitized_diagnostic("capacity-fixture-cleanup-diagnostic.json")
          print(f"Capacity certification failed at sanitized fixture stage: {prepare['stage']}")
          print(f"Sanitized fixture prepare diagnostic: {json.dumps(prepare, sort_keys=True)}")
          if cleanup["stage"] != "unavailable":
              print(f"Sanitized fixture cleanup diagnostic: {json.dumps(cleanup, sort_keys=True)}")
          PY
          exit 1

      - name: Publish sanitized aggregate evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capacity-certification-${{ github.sha }}
          path: |
            ${{ env.CAPACITY_EVIDENCE_DIR }}/capacity-certification.json
            ${{ env.CAPACITY_EVIDENCE_DIR }}/capacity-certification.md
          if-no-files-found: error
          retention-days: 14

      - name: Add sanitized summary
        if: success()
        run: cat "${CAPACITY_EVIDENCE_DIR}/capacity-certification.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove temporary cloud credentials
        if: always()
        run: rm -rf -- ~/.oci ~/.ssh
